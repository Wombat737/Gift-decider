name: Deploy web demo

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write

concurrency:
  group: web-demo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export Expo web (GitHub Pages subpath)
        run: npx expo export -p web
        env:
          EXPO_BASE_URL: /Gift-decider
      - run: node scripts/prepare-web-dist.js
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
