# Minimal Supabase CLI config for Gift Decider.
# Run `npx supabase init` in a fresh checkout if you want the full generated file;
# this is enough to serve the preview-url stub locally.

project_id = "gift-decider"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "exp://127.0.0.1:8081"
additional_redirect_urls = ["giftdecider://auth/callback", "http://localhost:8081", "http://127.0.0.1:8081"]

[functions.preview-url]
# Stub returns fake previews only — no private data. JWT optional so you can curl it.
verify_jwt = false

[functions.notify-organiser-ready-to-buy]
# Stub returns the would-be email. Sends only if Resend/Postmark env is set.
verify_jwt = false
