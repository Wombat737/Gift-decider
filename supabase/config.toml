# Minimal Supabase CLI config for Gift Decider.
# Run `npx supabase init` in a fresh checkout if you want the full generated file;
# this is enough to serve the preview-url stub locally.

project_id = "gift-decider"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = [
  "giftdecider://auth/callback",
  "http://localhost:8081",
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081",
  "http://127.0.0.1:8081/auth/callback",
  "exp://127.0.0.1:8081/--/auth/callback",
]

[functions.preview-url]
# Public OG/meta fetch for buy-link autofill. Instagram stays a stub. JWT optional so you can curl it.
verify_jwt = false

[functions.heal-link]
# HEAD/GET probe stub. Falls back to the in-app heuristic when this is undeployed.
verify_jwt = false

[functions.improv-substitutes]
# Empty suggestions without OPENAI_API_KEY so the app keeps its local catalog.
verify_jwt = false

[functions.notify-organiser-ready-to-buy]
# Stub returns the would-be email. Sends only if Resend/Postmark env is set.
verify_jwt = false
